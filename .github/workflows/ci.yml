name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Python syntax check
        run: find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -r python -m py_compile

      - name: Backend security scan
        run: bandit -q backend_fastapi.py

      - name: Python dependency audit
        run: pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts

      - name: PQC/reality test suite
        run: npm test

      - name: JavaScript dependency audit
        run: npm audit --audit-level=high
